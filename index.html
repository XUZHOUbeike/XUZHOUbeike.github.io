<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>城市总直通车 - 贝壳徐州 · 品质管理部</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(ellipse at 50% 0%, #1a5f49 0%, #0f4c39 50%, #082c20 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px 60px;
      position: relative;
      overflow-x: hidden;
    }

    .admin-link {
      position: absolute;
      top: 24px;
      right: 24px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 9999px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .admin-link:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
    }

    .admin-link svg {
      width: 16px;
      height: 16px;
      opacity: 0.9;
    }

    .tag {
      font-size: 14px;
      letter-spacing: 0.25em;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 18px;
      text-align: center;
    }

    h1 {
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
      font-size: clamp(46px, 9vw, 76px);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 24px;
      text-align: center;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .subtitle {
      font-size: 17px;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 52px;
      text-align: center;
    }

    .subtitle p + p {
      margin-top: 4px;
    }

    .card {
      max-width: 640px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      padding: 34px 38px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      margin-bottom: 56px;
    }

    .card ul {
      list-style: none;
    }

    .card li {
      position: relative;
      padding-left: 20px;
      margin-bottom: 18px;
      font-size: 16.5px;
      line-height: 1.75;
      color: rgba(255, 255, 255, 0.92);
    }

    .card li:last-child {
      margin-bottom: 0;
    }

    .card li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 11px;
      width: 7px;
      height: 7px;
      background: #f0c674;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(240, 198, 116, 0.45);
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 260px;
      padding: 15px 44px;
      background: #ffffff;
      color: #0d4a36;
      border: none;
      border-radius: 9999px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
      background: #f2f7f5;
    }

    .cta:active {
      transform: translateY(0);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(245, 247, 246, 0.96);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      z-index: 100;
    }

    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-box {
      background: #ffffff;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      padding: 42px 34px 36px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
      transform: translateY(12px);
      transition: transform 0.25s ease;
    }

    .modal-overlay.show .modal-box {
      transform: translateY(0);
    }

    .modal-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: rgba(15, 76, 57, 0.08);
      color: #0f4c39;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-icon svg {
      width: 30px;
      height: 30px;
    }

    .modal-title {
      font-size: 24px;
      font-weight: 700;
      color: #0f2e22;
      margin-bottom: 16px;
    }

    .modal-body {
      font-size: 15.5px;
      line-height: 1.75;
      color: #5a6b64;
      margin-bottom: 30px;
    }

    .modal-body p + p {
      margin-top: 6px;
    }

    .modal-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      padding: 13px 32px;
      background: #0f4c39;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .modal-btn:hover {
      background: #15684d;
      transform: translateY(-1px);
    }

    .modal-btn:active {
      transform: translateY(0);
    }

    @media (max-width: 480px) {
      body {
        padding: 100px 18px 60px;
      }

      .admin-link {
        top: 16px;
        right: 16px;
        padding: 7px 12px;
        font-size: 13px;
      }

      .card {
        padding: 26px 24px;
        border-radius: 18px;
      }

      .card li {
        font-size: 15.5px;
      }

      .cta {
        min-width: 220px;
        padding: 14px 36px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <a href="./admin-login.html" class="admin-link" aria-label="后台管理">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 8 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 8a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
    后台管理
  </a>

  <div class="tag">贝壳徐州 · 品质管理部</div>

  <h1>城市总直通车</h1>

  <div class="subtitle">
    <p>一线声音，直达城市总。</p>
    <p>让每一条反馈都被看见、被处理、被回应。</p>
  </div>

  <div class="card">
    <ul>
      <li>你是否苦于没有证据，每次举报都被驳回或石沉大海？</li>
      <li>你是否发现区域内存在破坏生态合作的违规行为，但举报后怕私下“报复”，所以不敢发声？或反馈后大事化小小事化了？</li>
    </ul>
  </div>

  <button class="cta" onclick="enterFeedback()">进入问题反馈</button>

  <div class="modal-overlay" id="noticeModal" onclick="closeModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <div class="modal-title">违法必查，违法必究</div>
      <div class="modal-body">
        <p>请如实反馈问题，恶意捏造或虚假举报将依规追责。</p>
        <p>您的反馈将受到严格保密，请放心提交。</p>
      </div>
      <button class="modal-btn" onclick="ackFeedback()">我已知晓，开始反馈</button>
    </div>
  </div>

  <script>
    // 注意：若部署到线上，请把 FEEDBACK_URL 替换为真实的问题反馈页面地址
    const FEEDBACK_URL = "./feedback.html";

    function enterFeedback() {
      document.getElementById("noticeModal").classList.add("show");
    }

    function closeModal(event) {
      if (event.target === document.getElementById("noticeModal")) {
        document.getElementById("noticeModal").classList.remove("show");
      }
    }

    function ackFeedback() {
      window.location.href = FEEDBACK_URL;
    }
  </script>
</body>
</html>
